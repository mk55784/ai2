App\Entity\Location:
    properties:
        city:
            - NotBlank:
                  groups: ['create', 'edit']
        country:
            - NotBlank:
                  groups: ['create', 'edit']
        latitude:
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Szerokosc musi byc miedzy {{ min }} a {{ max }}.'
                  groups: ['create', 'edit']
        longitude:
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Dlugosg musi być miedzy {{ min }} a {{ max }}.'
                  groups: ['create', 'edit']

App\Entity\Measurement:
    properties:
        date:
            - NotBlank:
                  groups: ['create', 'edit']
            - Type:
                  type: \DateInterface
                  groups: ['create', 'edit']
        celsius:
            - NotBlank:
                  groups: ['create','edit']
            - Type:
                  type: numeric
                  groups: ['create', 'edit']
        location:
            - NotNull:
                  groups: ['create', 'edit']
